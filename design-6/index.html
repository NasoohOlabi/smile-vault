<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>DAMA OBSRV — Design 6 · Playful Pop</title>
	<meta name="description"
		content="DAMA OBSRV — ملصقات ومطبوعات سورية. Syrian stickers and prints, hand-drawn and printed in Damascus." />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="format-detection" content="telephone=no" />
	<script>window.DAMA_BASE = "../";</script>
	<link rel="stylesheet" href="../assets/base.css" />
	<link rel="stylesheet" href="./design.css" />
</head>

<body>
	<!-- ============ HEADER ============ -->
	<header class="site-header">
		<div class="header-bar">
			<a href="#top" class="brand">
				<span class="brand__main">DAMA</span>
				<span class="brand__sub">OBSRV</span>
			</a>

			<div class="search search--desktop">
				<svg class="search__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
					<path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
				</svg>
				<input id="searchInput" type="search" enterkeyhint="search" data-i18n-placeholder="search" class="search__input" />
			</div>

			<div class="header-actions">
				<button id="langToggle" class="btn btn--ghost" title="العربية / English">
					<span id="langLabel">EN</span>
				</button>
				<button id="cartBtn" class="btn btn--solid">
					<span data-i18n="cart">السلة</span>
					<span id="cartCount" class="badge">0</span>
				</button>
			</div>
		</div>

		<div id="searchRow" class="search-row">
			<div class="search">
				<svg class="search__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
					<path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
				</svg>
				<input id="searchInputMobile" type="search" enterkeyhint="search" data-i18n-placeholder="search" class="search__input" />
			</div>
		</div>

		<nav id="filterNav" class="filter-nav">
			<div class="filter-nav__track"></div>
		</nav>
	</header>

	<!-- ============ HERO ============ -->
	<section id="top" class="hero">
		<h1 class="hero__title" data-i18n="heroTitle"></h1>
		<p class="hero__sub" data-i18n="heroSub"></p>
		<div class="hero__stats">
			<span class="stat"><b id="statCount">0</b> <span data-i18n="statDesigns"></span></span>
			<span class="stat"><b id="statPrice"></b> <span data-i18n="statEach"></span></span>
		</div>
	</section>

	<!-- ============ GRID ============ -->
	<main class="main">
		<div id="grid" class="product-grid"></div>
		<p id="emptyState" hidden class="empty-state" data-i18n="noResults"></p>
		<div id="skeleton" class="product-grid"></div>
	</main>

	<!-- ============ FOOTER ============ -->
	<footer class="site-footer">
		<p class="site-footer__brand">DAMA OBSRV</p>
		<p class="site-footer__note" data-i18n="footer"></p>
	</footer>

	<!-- ============ STICKY CART BAR (phones) ============ -->
	<div id="mobileBar" class="mobile-bar">
		<button id="mobileCartBtn" class="mobile-bar__btn">
			<span id="barThumbs" class="bar-thumbs"></span>
			<span class="mobile-bar__label">
				<span id="barCount" class="mobile-bar__count"></span>
				<span data-i18n="viewCart"></span>
			</span>
			<span id="mobileTotal" class="mobile-bar__total"></span>
		</button>
	</div>

	<!-- ============ CART PANEL ============ -->
	<div id="cartOverlay" hidden class="overlay"></div>
	<aside id="cartDrawer" hidden class="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
		<div id="dragHandle" class="drag-handle">
			<div class="drag-handle__grip"></div>
		</div>

		<div class="cart-drawer__head">
			<h2 id="cartTitle" class="cart-drawer__title" data-i18n="yourOrder"></h2>
			<button id="cartClose" class="icon-btn">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<path stroke-linecap="round" d="M6 18L18 6M6 6l12 12" />
				</svg>
			</button>
		</div>

		<div id="cartBody" class="cart-body"></div>

		<div class="cart-drawer__foot">
			<div class="cart-drawer__total-row">
				<span data-i18n="total"></span>
				<span id="totalPrice"></span>
			</div>
			<button id="checkoutBtn" class="btn btn--accent btn--block" data-i18n="checkout"></button>
		</div>

		<form id="orderForm" hidden class="checkout-form">
			<div class="checkout-form__head">
				<button type="button" id="backToCart" class="icon-btn">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
					</svg>
				</button>
				<h2 class="checkout-form__title" data-i18n="details"></h2>
			</div>

			<div class="checkout-form__body">
				<div class="field-group">
					<label class="field-label" for="customerName"><span data-i18n="fName"></span> <span class="req">*</span></label>
					<input id="customerName" type="text" autocomplete="name" enterkeyhint="next" class="field" />
				</div>
				<div class="field-group">
					<label class="field-label" for="phone"><span data-i18n="fPhone"></span> <span class="req">*</span></label>
					<input id="phone" type="tel" inputmode="tel" pattern="[0-9]*" placeholder="09XXXXXXXX" autocomplete="tel"
						enterkeyhint="next" class="field" />
				</div>
				<div class="field-group">
					<label class="field-label" for="instaAccount"><span data-i18n="fInsta"></span></label>
					<input id="instaAccount" type="text" placeholder="@yourhandle" autocapitalize="none" autocorrect="off"
						spellcheck="false" enterkeyhint="next" class="field" />
				</div>
				<div class="field-group">
					<label class="field-label" for="customerAddress"><span data-i18n="fAddress"></span> <span class="req">*</span></label>
					<textarea id="customerAddress" rows="3" autocomplete="street-address" class="field"></textarea>
				</div>
				<div class="field-group">
					<label class="field-label" for="orderNotes"><span data-i18n="fNotes"></span></label>
					<textarea id="orderNotes" rows="2" class="field"></textarea>
				</div>
				<div id="orderResponse"></div>
			</div>

			<div class="checkout-form__foot">
				<div class="checkout-form__total-row">
					<span data-i18n="total"></span>
					<b id="totalPrice2"></b>
				</div>
				<button type="submit" id="submitBtn" class="btn btn--accent btn--block" data-i18n="submit"></button>
			</div>
		</form>
	</aside>

	<!-- ============ LIGHTBOX ============ -->
	<div id="lightbox" hidden class="lightbox" role="dialog" aria-modal="true">
		<div class="lightbox__top">
			<span id="lbCounter" class="lightbox__counter"></span>
			<button id="lbClose" class="icon-btn icon-btn--ghost">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<path stroke-linecap="round" d="M6 18L18 6M6 6l12 12" />
				</svg>
			</button>
		</div>

		<button id="lbPrev" class="lightbox__nav lightbox__nav--prev">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
				<path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
			</svg>
		</button>
		<button id="lbNext" class="lightbox__nav lightbox__nav--next">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
				<path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
			</svg>
		</button>

		<div id="lbStage" class="lightbox__stage">
			<div class="lightbox__frame">
				<img id="lbImg" class="lightbox__img" draggable="false" alt="" />
			</div>
			<div class="lightbox__info">
				<h3 id="lbName" class="lightbox__name"></h3>
				<p id="lbCat" class="lightbox__cat"></p>
				<p id="lbPrice" class="lightbox__price"></p>
			</div>
			<div id="lbQty" class="qty qty--lightbox"></div>
			<p class="lightbox__hint" data-i18n="swipeHint"></p>
		</div>
	</div>

	<!-- ============ TOASTS ============ -->
	<div id="toasts" class="toast-host"></div>

	<script src="../assets/i18n.js"></script>
	<script src="../assets/app.js"></script>
</body>

</html>

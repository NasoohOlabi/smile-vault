label: Dama x Elat
tease: true
feature:
  title: Dama x Elat
  dates: 19 January 2026 – Ongoing
  copy: >
    The founder of Elat reached out on 19 January 2026 with a proposal to
    collaborate on bringing Elat’s knowledge and passion for astrology back to
    Damascus and Syria at large. The collaboration focuses on raising awareness
    of Damascus’s long history of astronomical knowledge, including the
    prominent scientists who lived in or originated from the city, while
    exploring the deep-rooted fascination with the cosmos within Syrian culture.

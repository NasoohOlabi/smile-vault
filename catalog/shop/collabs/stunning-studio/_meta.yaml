  copy: >
    A member of the campaign team reached out on 18 May 2026 to explore a
    collaboration around the Bring The Money You Owe campaign. The
    collaboration culminated in an event on 22 July, bringing together people
    who believe in and support the campaign. All sales from the collaboration
    went toward funding the campaign. A copy of the campaign can be requested
    through Stunning Studio.

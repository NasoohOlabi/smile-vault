<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dama Orders Dashboard</title>
    <link rel="icon" href="/assets/logo-dama.png" />
    <link rel="stylesheet" href="/src/orders.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div><div class="eyebrow">DAMA / OPERATIONS</div><h1>Orders dashboard</h1><p id="status">Loading the shared sheet…</p></div>
        <button id="refresh" class="button">Refresh data</button>
      </header>
      <section id="summary" class="metrics"></section>
      <section class="toolbar panel"><label>Search orders <input id="search" type="search" placeholder="Name, phone, item, address…" /></label><label>Status <select id="statusFilter"><option value="all">All orders</option><option value="delivered">Delivered</option><option value="open">Not delivered</option></select></label><label>From <input id="from" type="date" /></label><label>To <input id="to" type="date" /></label></section>
      <section class="grid-two"><div class="panel"><div class="section-head"><div><div class="eyebrow">PERFORMANCE</div><h2>Sales over time</h2></div><span class="muted">SYP</span></div><div id="chart" class="chart"></div></div><div class="panel"><div class="section-head"><div><div class="eyebrow">ASSORTMENT</div><h2>Top products</h2></div></div><div id="products" class="product-list"></div></div></section>
      <section class="panel orders-panel"><div class="section-head"><div><div class="eyebrow">ORDER LOG</div><h2>Orders <span id="count" class="count"></span></h2></div><button id="export" class="button secondary">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Profit</th><th>Status</th><th></th></tr></thead><tbody id="orders"></tbody></table></div></section>
    </main>
    <script type="module" src="/src/orders.js"></script>
  </body>
</html>

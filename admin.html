<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Dama Studio</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64">
    <script type="module" src="/src/admin.js"></script>
  </head>
  <body>
    <main class="sign-in" id="sign-in" hidden>
      <form id="login-form">
        <img class="studio-mark" src="/assets/logo-dama.png" alt="Dama">
        <h1>Dama Studio</h1>
        <p>Sign in to manage the nightly store.</p>
        <label>Admin password<input name="password" type="password" autocomplete="current-password" required></label>
        <p class="form-error" role="alert"></p>
        <button class="primary">Sign in</button>
        <a href="/">Back to store</a>
      </form>
      <figure>
        <img src="/Posters/01.png" alt="Ready 4 Dama poster">
        <figcaption>Ready 4 Dama</figcaption>
      </figure>
    </main>
    <div class="studio" id="studio" hidden>
      <aside class="rail">
        <a class="studio-brand" href="#orders">
          <img class="studio-mark" src="/assets/logo-dama.png" alt="">
          <span>Dama Studio<small>Nightly store</small></span>
        </a>
        <nav aria-label="Studio">
          <a href="#orders">Orders</a>
          <a href="#products">Products</a>
          <a href="#storefront">Storefront</a>
          <a href="#assets">Images</a>
        </nav>
        <div class="rail-footer">
          <a href="/" target="_blank" rel="noopener">Open store ↗</a>
          <button id="logout" type="button">Sign out</button>
        </div>
      </aside>
      <main class="workspace" id="workspace" aria-live="off">
        <header class="page-header">
          <div><h1 id="page-title" tabindex="-1"></h1><p id="page-description"></p></div>
          <div id="page-actions"></div>
        </header>
        <div id="page"></div>
      </main>
    </div>
    <p id="app-status" class="toast" role="status" hidden></p>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="editor-form">
        <header>
          <h2 id="editor-title"></h2>
          <button type="button" data-close aria-label="Close dialog">×</button>
        </header>
        <div id="editor-body"></div>
        <p class="form-error" role="alert"></p>
        <footer>
          <button type="button" data-close>Cancel</button>
          <button class="primary" id="editor-save"></button>
        </footer>
      </form>
    </dialog>
    <noscript>Enable JavaScript to open Dama Studio.</noscript>
  </body>
</html>
